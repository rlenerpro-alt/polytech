<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHOT 3A</title>
<meta name="description" content="Planning, devoirs, notes et révisions — Polytech Paris-Saclay PHOT 3A">
<meta name="theme-color" content="#090B11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHOT 3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090B11; --surface:#121621; --ink:#E7EAF2; --muted:#8A91A6; --line:#252C3D; --soft:#1A2030;
  --good:#34D399; --bad:#FB5C7A; --warn:#FBBF24; --acc:#60A5FA;
  --m1:#3B82F6; --m2:#F97316; --m3:#8B5CF6; --m4:#06B6D4; --m5:#EAB308; --m6:#22C55E; --m7:#C084FC; --m8:#94A3B8;
  --glow:0 0 10px; --radius:14px;
  --ui:"Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#E4E7EE; --surface:#EEF0F5; --ink:#161B28; --muted:#586074; --line:#CDD3DE; --soft:#DDE1E9;
  --good:#059669; --bad:#E11D48; --warn:#B45309; --acc:#2563EB;
  --m1:#2563EB; --m2:#EA580C; --m3:#7C3AED; --m4:#0891B2; --m5:#CA8A04; --m6:#16A34A; --m7:#A855F7; --m8:#64748B;
  --glow:0 0 0; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
header.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 0 8px}
.spec{height:3px;border-radius:2px;background:linear-gradient(90deg,#8B5CF6,#3B82F6,#06B6D4,#22C55E,#EAB308,#F97316,#EF4444);margin-bottom:12px}
.thm{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted);cursor:pointer}
.nm{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-weight:400;margin-left:4px}
.dot{box-shadow:var(--glow) currentColor}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.5rem;letter-spacing:-.02em;font-weight:700}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)} .sync.local i{background:var(--warn)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 10px 10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:700px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs .wrap{justify-content:space-around;padding:0 4px}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.62rem;padding:8px 2px 6px;border-bottom:0;border-top:3px solid transparent;flex:1}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--ink)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.panel{display:none;padding:16px 0 40px}
.panel.active{display:block}
h2{font-size:1.25rem;margin:18px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:110px;font-family:var(--mono);font-size:.85rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500;flex:1;min-width:140px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:currentColor}
.pill{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.pill.hi{color:var(--bad)} .pill.mid{color:var(--warn)} .pill.lo{color:var(--good)} .pill.none{color:var(--muted)}
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--soft);align-items:flex-start}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--mono);font-size:.82rem;color:var(--muted);min-width:92px;padding-top:2px}
.ev .b{flex:1;min-width:0}
.ev .n{font-weight:600}
.ev .l{font-size:.8rem;color:var(--muted)}
.ev.dev{background:color-mix(in srgb, var(--bad) 8%, transparent);border-radius:8px;padding:8px;border-top:0;margin:4px 0}
.ev .bar{width:4px;align-self:stretch;border-radius:2px}
.day h3{font-size:.95rem;margin:14px 0 4px;text-transform:capitalize}
.day.today h3{color:var(--acc)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}
table.t td.num,table.t th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
table.t input[type=number]{width:72px;text-align:right;font-family:var(--mono)}
.mod{border-left:4px solid var(--line)}
.mod h3{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.big{font-family:var(--mono);font-size:1.15rem}
.ok{color:var(--good)} .ko{color:var(--bad)} .wn{color:var(--warn)}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:6px 0 2px}
.alloc i{display:block;height:100%}
details.fold{border-top:1px solid var(--line);margin-top:10px}
details.fold summary{cursor:pointer;padding:10px 0;font-weight:600}
.radars{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.radars canvas{width:100%;height:270px;display:block}
.links a{color:var(--acc);text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 10px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
@media (max-width:560px){table.t select{max-width:92px;font-size:.8rem;padding:5px 4px}table.t th,table.t td{padding:6px 3px}.mod{padding:12px 10px}}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}

/* planning */
.ptool{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.ptool .ttl{font-weight:600;min-width:150px;text-align:center}
.wgrid{display:grid;grid-template-columns:44px repeat(var(--nd),minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wgrid .hd{padding:6px 4px;text-align:center;font-size:.8rem;border-bottom:1px solid var(--line);border-left:1px solid var(--soft);cursor:pointer}
.wgrid .hd b{display:block;font-size:1.05rem}
.wgrid .hd.today{color:var(--acc)} .wgrid .hd.today b{background:var(--acc);color:var(--surface);border-radius:50%;width:28px;height:28px;line-height:28px;margin:0 auto}
.wgrid .ad{border-left:1px solid var(--soft);border-bottom:1px solid var(--line);padding:3px;min-height:28px;display:flex;flex-direction:column;gap:3px}
.wgrid .adl{font-size:.65rem;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 2px;text-align:right}
.wgrid .hrs{position:relative}
.wgrid .hrs span{position:absolute;right:4px;font-size:.68rem;color:var(--muted);font-family:var(--mono);transform:translateY(-50%)}
.wgrid .col{position:relative;border-left:1px solid var(--soft);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--soft) calc(var(--hh) - 1px),var(--soft) var(--hh))}
.wgrid .col.today{background-color:color-mix(in srgb, var(--acc) 5%, transparent)}
.blk{position:absolute;border-radius:6px;padding:3px 5px;font-size:.72rem;line-height:1.2;overflow:hidden;cursor:pointer;border-left:3px solid var(--c);background:color-mix(in srgb, var(--c) 16%, var(--surface));color:var(--ink)}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.blk.ds{border:2px solid var(--bad);border-left-width:4px;background:color-mix(in srgb, var(--bad) 14%, var(--surface));z-index:2}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}
.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.chip{display:flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;border-radius:5px;padding:2px 5px;cursor:pointer;border:1px solid var(--c);color:var(--ink);background:color-mix(in srgb, var(--c) 14%, var(--surface));overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.ds{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 14%, var(--surface))}
.chip.done{opacity:.5;text-decoration:line-through}
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dstrip button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted)}
.dstrip button b{font-size:1rem;color:var(--ink)}
.dstrip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dstrip button[aria-pressed="true"] b{color:var(--surface)}
.dstrip .dots{display:flex;gap:2px;height:6px;margin-top:2px}
.dstrip .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted)} .dstrip .dots i.r{background:var(--bad)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.mgrid .wd{font-size:.72rem;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mgrid .mc{min-height:86px;border-left:1px solid var(--soft);border-top:1px solid var(--soft);padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mgrid .mc:nth-child(7n+1){border-left:0}
.mgrid .mc.out{opacity:.45}
.mgrid .mc .dn{font-size:.8rem;font-weight:600}
.mgrid .mc.today .dn{color:var(--surface);background:var(--acc);border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px}
.mgrid .mc .cn{font-size:.68rem;color:var(--muted)}
.mgrid .mc:hover{background:var(--soft)}
@media (max-width:700px){.mgrid .mc{min-height:62px;padding:3px}.mgrid .chip{font-size:.6rem;padding:1px 3px}}
#viewer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
#viewer[hidden]{display:none}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
#viewer .vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer iframe{flex:1;border:0;width:100%;background:var(--bg)}
.blk.rv.vd,.chip.rv.vd{border-style:solid;opacity:.6}
.blk.rv,.chip.rv{border-style:dashed;border-width:1.5px;border-left-width:3px;background:color-mix(in srgb, var(--c) 7%, var(--surface))}
.blk .more{display:none;margin-top:6px;font-size:.78rem;line-height:1.4}
.blk.open{height:auto!important;min-height:120px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(300px,calc(100vw - 72px))!important;cursor:default;padding:8px 10px;background:color-mix(in srgb, var(--c) 10%, var(--surface))}
.blk.open.rt{left:auto!important;right:2px}
.blk.open .s{white-space:normal}
.blk.open .more{display:block}
.blk .more dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0 0 6px}
.blk .more dt{color:var(--muted)} .blk .more dd{margin:0}
.blk .more .it{display:flex;gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--soft);cursor:pointer}
.blk .more .add{margin-top:6px;width:100%;justify-content:center;display:flex;gap:6px;align-items:center}
.wgrid{overflow:visible}
#auth{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#auth[hidden]{display:none}
#auth .abox{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
#auth input{width:100%}
.sec{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 6px}
.sec a{text-transform:none;letter-spacing:0;color:var(--acc);font-weight:500}
.card.hc{padding:4px 14px}
.hr{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--soft);cursor:pointer}
.hr:first-child{border-top:0}
.hr input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);flex:none}
.hr .ht{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hr .hd{font-size:.85rem;color:var(--muted);white-space:nowrap}
.nc{display:flex;gap:12px;padding:10px 0;cursor:pointer}
.nc .bar{width:4px;border-radius:2px;align-self:stretch}
.nc .n{font-weight:600;font-size:1.05rem}
.nc .l{font-size:.85rem;color:var(--muted);margin-top:2px}
.prose-i h3{margin:4px 0 8px;font-size:1rem}
.prose-i p{margin:0 0 10px;color:var(--muted);font-size:.92rem;line-height:1.5}
.prose-i p:last-child{margin-bottom:4px}
/* devoirs */
.pbar{padding:10px 0;border-top:1px solid var(--soft)}
.pbar:first-of-type{border-top:0}
.pb{position:relative;height:12px;border-radius:6px;background:var(--soft);border:1px solid var(--line);margin:6px 0 4px;overflow:hidden}
.pb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:6px 0 0 6px}
.pb u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb, var(--c) 45%, transparent) 0 4px,transparent 4px 8px);text-decoration:none}
.pbar a{color:var(--acc)}
.hw{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--soft)}
.hw:first-child{border-top:0}
.hw input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);flex:none}
.hw .b{flex:1;min-width:0}
.hw .n{font-weight:600}
.hw.done .n{text-decoration:line-through;color:var(--muted)}
.hw .l{font-size:.8rem;color:var(--muted)}
.hw .l a{color:var(--acc)}
.late{color:var(--bad);font-weight:600}
.tp-pill{font-size:.7rem;font-weight:600;border-radius:4px;padding:1px 6px;border:1px solid currentColor;margin-left:4px}
/* cours */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mcard h4{margin:0;font-size:1rem}
.mcard .pg{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:8px;padding:8px 10px;text-decoration:none;color:var(--ink);font-weight:500}
.mcard .pg:hover{outline:1px solid var(--ink)}
.mcard .pg span{color:var(--acc)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="display:block"><div class="spec"></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap"><h1>PHOT 3A</h1><div class="row"><span class="sync" id="sync"><i></i><span>Chargement…</span></span><button class="thm" id="thm" type="button">Clair</button><button class="thm" id="acct" type="button">Compte</button></div></div></div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</button>
  <button role="tab" data-tab="dev" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Devoirs</button>
  <button role="tab" data-tab="notes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Notes</button>
  <button role="tab" data-tab="cours" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16"/></svg>Cours</button>
  <button role="tab" data-tab="tree" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 6-3 10H7L4 9z"/></svg>Compétences</button>
</div></nav>
<main class="wrap">
  <section class="panel active" id="home"></section>
  <section class="panel" id="plan"></section>
  <section class="panel" id="dev"></section>
  <section class="panel" id="notes"></section>
  <section class="panel" id="tree"></section>
  <section class="panel" id="cours"></section>
</main>
<dialog id="dlg"></dialog>

function parseOasis(){
  const txt=$("oasisIn").value, lines=txt.split(/\n/).map(function(l){return l.trim();}).filter(Boolean);
  const names=[]; Object.keys(MAT).forEach(function(k){ names.push([norm(matName(k)),k]); });
  names.push(["informatique & algorithmique","f1o1-3"],["algebre","f1c3-2"],["optique intrumentale","f1o2-3"],["economie generale","f1c2-1"],["economie d'entreprise","f1c2-2"],["energie","f1c4-2"],["developpement durable","f1c4-1"]);
  names.sort(function(a,b){ return b[0].length-a[0].length; });
  const found=[]; let cur=null;
  lines.forEach(function(l){
    const n=norm(l); const hit=names.find(function(x){ return n.indexOf(x[0])>=0; }); if(hit) cur=hit[1];
    const m=l.match(/(?:^|[^\d])(\d{1,2}(?:[.,]\d{1,3})?)\s*(?:\/\s*20)?(?![\d%])/g);
    if(cur&&m){ m.map(function(s){ return parseFloat(s.replace(/[^\d.,]/g,"").replace(",",".")); }).filter(function(v){ return v>=0&&v<=20&&(/\/\s*20/.test(l)||/[.,]/.test(String(v))||hit===undefined); }).slice(0,1).forEach(function(v){ found.push({mat:cur,note:v,line:l}); }); }
  });
  const out=$("oasisOut");
  if(!found.length){ out.innerHTML='<p class="small ko">Aucune note reconnue. Envoie-moi un exemple de collage pour que j\'adapte la lecture.</p>'; return; }
  out.innerHTML='<table class="t"><thead><tr><th></th><th>Matière</th><th class="num">Note</th><th>Ligne lue</th></tr></thead><tbody>'+found.map(function(f,i){ return '<tr><td><input type="checkbox" checked data-oi="'+i+'"></td><td>'+esc(matName(f.mat))+'</td><td class="num">'+fr(f.note,2)+'</td><td class="small muted">'+esc(f.line.slice(0,80))+'</td></tr>'; }).join("")+'</tbody></table><button class="btn primary" id="oasisOk" style="margin-top:8px">Enregistrer les notes cochées</button><p class="small muted">Chaque note complète le plus ancien devoir sans note de la matière ; s\'il n\'y en a pas, un devoir « Note Oasis » est créé.</p>';
  $("oasisOk").addEventListener("click",function(){
    let n=0; out.querySelectorAll("[data-oi]").forEach(function(cb){ if(!cb.checked) return; const f=found[+cb.dataset.oi];
      const pend=S.evals.filter(function(e){ return e.mat===f.mat&&counts(e)&&!hasNote(e); }).sort(function(a,b){ return a.date<b.date?-1:1; })[0];
      if(pend) pend.note=f.note; else S.evals.push({id:uid(),mat:f.mat,type:MAT[f.mat].tpOnly?"TP":"DS",title:"Note Oasis",date:today(),time:"",ressenti:"moyen",note:f.note,poids:null}); n++; });
    save(); renderAll(); toast(n+" note(s) enregistrée(s)");
  });
}

function renderTree(){

  $("tree").innerHTML=h;

function drawRadars(){
  const mode=S.ui.treeMode;
  document.querySelectorAll("canvas[data-radar]").forEach(function(cv){
    const M=MODS[+cv.dataset.radar], r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    if(!r.width) return;
    cv.width=r.width*dpr; cv.height=r.height*dpr; const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
    const w=r.width,h=r.height,cx=w/2,cy=h/2+6,R=Math.min(w*0.3,h/2-44), n=Math.max(3,M.m.length);
    const ang=function(i){ return -Math.PI/2+i*2*Math.PI/n; };
    const P=function(i,v){ return [cx+Math.cos(ang(i))*R*v/20, cy+Math.sin(ang(i))*R*v/20]; };
    c.strokeStyle=css("--line"); c.lineWidth=1;
    [5,10,15,20].forEach(function(v){ c.beginPath(); for(let i=0;i<n;i++){ const p=P(i,v); if(i) c.lineTo(p[0],p[1]); else c.moveTo(p[0],p[1]); } c.closePath(); c.stroke(); });
    c.save(); c.setLineDash([4,3]); c.lineWidth=1.5;
    [[SEUIL_MAT,"--bad"],[SEUIL_MOD,"--muted"]].forEach(function(s){ c.strokeStyle=css(s[1]); c.beginPath(); for(let i=0;i<n;i++){ const p=P(i,s[0]); if(i) c.lineTo(p[0],p[1]); else c.moveTo(p[0],p[1]); } c.closePath(); c.stroke(); });
    c.restore();
    for(let i=0;i<n;i++){ const p=P(i,20); c.strokeStyle=css("--line"); c.beginPath(); c.moveTo(cx,cy); c.lineTo(p[0],p[1]); c.stroke(); }
    const vals=[]; for(let i=0;i<n;i++){ const x=M.m[i]; if(!x){ vals.push(null); continue; } const s=matStats(x[0]); vals.push(mode==="proj"?s.proj:s.known); }
    const col=modColor(M);
    c.beginPath(); vals.forEach(function(v,i){ const p=P(i,v==null?0:Math.max(0,Math.min(20,v))); if(i) c.lineTo(p[0],p[1]); else c.moveTo(p[0],p[1]); }); c.closePath();
    c.globalAlpha=0.22; c.fillStyle=col; c.fill(); c.globalAlpha=1; c.strokeStyle=col; c.lineWidth=2; c.stroke();
    c.font="11px "+css("--ui"); c.textBaseline="middle";
    vals.forEach(function(v,i){ const x=M.m[i]; if(!x) return; const p=P(i,v==null?0:Math.max(0,Math.min(20,v))); c.fillStyle=v!=null&&v<SEUIL_MAT?css("--bad"):col; c.beginPath(); c.arc(p[0],p[1],3.5,0,7); c.fill();
      const q=P(i,23), a=ang(i); c.textAlign=Math.abs(Math.cos(a))<0.2?"center":Math.cos(a)>0?"left":"right"; c.fillStyle=css("--ink");
      const room=c.textAlign==="center"?w-16:c.textAlign==="left"?w-q[0]-6:q[0]-6; let name=x[1]; while(name.length>4&&c.measureText(name).width>room) name=name.slice(0,-2)+"…"; c.fillText(name,q[0],q[1]-6); c.fillStyle=v==null?css("--muted"):v>=SEUIL_NOTE?css("--good"):css("--bad"); c.fillText((v==null?"—":fr(v,1))+" · coef "+x[2],q[0],q[1]+7); });
  });
}

   '<label class="f" style="margin-top:10px">Spécialité<select id="specSel">'+Object.keys(SPECS).map(function(k){ return '<option value="'+k+'"'+(S.spec===k?" selected":"")+'>'+esc(SPECS[k].name)+'</option>'; }).join("")+'</select></label><p class="small muted">Maquettes 3A 2025-2026. Le planning ADE automatique n\'est disponible que pour PHOT pour l\'instant.</p>'+
   '<div class="row" style="justify-content:space-between;margin-top:14px">'+(user?'<button class="btn danger" value="out">Se déconnecter</button>':'<button class="btn primary" value="in">Se connecter / créer un compte</button>')+'<button class="btn" value="ok">Fermer</button></div></form>';
  d.showModal();
  $("specSel").addEventListener("change",function(){ const v=this.value; if(v===S.spec) return; if(S.evals.length&&!confirm("Changer de spécialité ? Tes devoirs et notes actuels seront masqués (ils réapparaîtront si tu reviens sur "+(SPECS[S.spec]||{}).short+").")){ this.value=S.spec; return; } S.spec=v; applySpec(v); ADE={spe:{ev:[],at:null},tc:{ev:[],at:null},grp:{ev:[],at:null}}; rebuildAde(); save(); renderAll(); refreshAde(true); });
  d.onclose=async function(){ if(d.returnValue==="out"){ backup("avant déconnexion"); await sb.auth.signOut(); user=null; dirtyApp=false; S=JSON.parse(JSON.stringify(DEF)); BASE={i:{},r:null}; persistLocal(); try{ localStorage.removeItem("polytech-owner"); }catch(e){} renderAll(); showAuth(true); setAcct(); } else if(d.returnValue==="in") showAuth(true); };
});
async function newPassword(){ const pw=prompt("Nouveau mot de passe (6 caractères minimum) :"); if(!pw||pw.length<6) return; const r=await sb.auth.updateUser({password:pw}); toast(r.error?r.error.message:"Mot de passe modifié"); }
(async function(){
  if(!sb){ setSync("local"); setAcct(); return; }
  sb.auth.onAuthStateChange(function(ev,session){ if(ev==="PASSWORD_RECOVERY"){ user=session&&session.user; showAuth(false); setTimeout(newPassword,300); } });
  const r=await sb.auth.getSession(); const ses=r.data&&r.data.session;
  let mode=null; try{ mode=localStorage.getItem("polytech-mode"); }catch(e){}
  if(ses) onLogin(ses.user); else if(mode==="local"){ setSync("local"); setAcct(); } else showAuth(true);
})();
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"){ if(user&&Date.now()-lastPull>30000) pull(false); refreshAde(false); } else flush(); });

/* ================= ADE automatique ================= */
async function refreshAde(force){
  if(!/^https?:/.test(location.protocol)) return;
  let changed=false;
  const gr=grpRes(); if(!gr&&ADE.grp.res){ ADE.grp={ev:[],at:null}; changed=true; }
  for(const k of ["spe","tc","grp"]){
    const a=ADE[k], res=k==="grp"?gr:(SPEC.ade&&SPEC.ade[k]); if(!res) continue; if(!force&&a.auto&&a.res===res&&a.at&&Date.now()-a.at<3*3600e3) continue;
    try{ const r=await fetch("/api/ade?res="+res,{cache:"no-store"}); if(!r.ok) continue; const ev=parseICS(await r.text()); if(ev.length){ ADE[k]={ev:ev,at:Date.now(),auto:true,res:res}; changed=true; } }catch(e){}
  }
  if(changed){ rebuildAde(); persistLocal(); renderAll(); }
  return changed;
}
refreshAde(false);
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
